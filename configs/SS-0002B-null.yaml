# False-alarm calibration for SS-0002B: the 200 quiet SS-0001 Kepler stars, searched
# inverted and block-scrambled with each of SS-0002B's four methods. Gives each method
# its SDE threshold for a 1% false-alarm rate on quiet real stars.
id: SS-0002B-null
question: What SDE threshold gives each SS-0002B method a 1% false-alarm rate on quiet Kepler stars?
seed: 20023
kind: false_alarm
mission: kepler
stars_file: configs/stars/SS-0001.csv
quarters: [2, 3, 4, 5]
injection:
  noise_detrend: biweight-1.0
  period_d: [1, 30]
detrend:
  - biweight-0.25
  - biweight-0.5
  - biweight-1.0
  - prewhiten+biweight-1.0
search:
  method: bls
  durations_hr: [1.5, 2.5, 4.0, 6.0, 9.0]
  oversample: 3
  bin_min: 60
false_alarm:
  inverted: true
  scrambles: 4
  block_d: 10.0
n_jobs: 4
