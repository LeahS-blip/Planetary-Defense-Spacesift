[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacesift"
version = "0.1.0"
description = "An open computational laboratory for exoplanet transit detectability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "matplotlib",
    "joblib",
    "astropy",
    "lightkurve",
    "astroquery",
    "wotan",
]

[project.optional-dependencies]
# Both need a C compiler on Python versions without prebuilt wheels.
batman = ["batman-package"]
tls = ["transitleastsquares"]
dev = ["pytest"]

[project.scripts]
spacesift = "spacesift.cli:main"

[tool.setuptools.packages.find]
include = ["spacesift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
